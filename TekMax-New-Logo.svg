<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" width="100%" height="100%">
  <defs>
    <!-- Crimson to Rose Gradient -->
    <linearGradient id="tmCrimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff244d"/>
      <stop offset="100%" stop-color="#dc1f43"/>
    </linearGradient>

    <!-- Electric Cyan to Royal Blue Gradient -->
    <linearGradient id="tmBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Chrome Slate Gradient -->
    <linearGradient id="tmDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="tmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#dc1f43" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    .tm-main-text {
      font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
      font-weight: 900;
      font-size: 56px;
      letter-spacing: -1px;
      fill: #0f172a;
    }
    .tm-accent-text {
      font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
      font-weight: 900;
      font-size: 56px;
      letter-spacing: -1px;
      fill: url(#tmCrimsonGrad);
    }
    .tm-badge-text {
      font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 2px;
      fill: #2563eb;
    }
    [data-theme="dark"] .tm-main-text {
      fill: #f8fafc;
    }
  </style>

  <!-- EMBLEM GROUP (Left in LTR) -->
  <g transform="translate(10, 8)">
    <!-- Outer Cyber Track / Crescent Arc -->
    <path d="M 52,14 A 38,38 0 1,0 84,68" fill="none" stroke="url(#tmBlueGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="160 30"/>

    <!-- Dynamic Tech T-Bar -->
    <path d="M 28,32 L 68,32 C 72,32 75,35 75,39 L 75,41 C 75,43 73,45 71,45 L 54,45 L 54,80 C 54,84 51,87 47,87 L 43,87 C 39,87 36,84 36,80 L 36,45 L 25,45 C 23,45 21,43 21,41 L 21,39 C 21,35 24,32 28,32 Z" fill="url(#tmDarkGrad)"/>

    <!-- Dynamic Tech M-Wings (Crimson Red) -->
    <path d="M 52,42 L 66,74 L 78,48 L 90,74 L 102,42 C 104,38 108,36 112,38 L 114,39 C 117,41 118,45 116,49 L 98,85 C 96,89 91,91 87,89 L 78,72 L 69,89 C 65,91 60,89 58,85 L 42,49 C 40,45 42,40 46,38 L 48,37 C 50,36 53,38 54,42 Z" fill="url(#tmCrimsonGrad)" filter="url(#tmGlow)"/>

    <!-- Futuristic Cyber Dots -->
    <circle cx="16" cy="24" r="3.5" fill="#38bdf8"/>
    <circle cx="26" cy="16" r="2.5" fill="#2563eb"/>
    <circle cx="10" cy="38" r="2" fill="#ff244d"/>
    <rect x="88" y="16" width="6" height="6" rx="1.5" fill="#dc1f43"/>
    <rect x="100" y="24" width="4" height="4" rx="1" fill="#2563eb"/>
  </g>

  <!-- BRAND NAME TYPOGRAPHY -->
  <g transform="translate(145, 70)">
    <!-- "Tek" -->
    <text x="0" y="0" class="tm-main-text">Tek</text>
    <!-- "Max" -->
    <text x="102" y="0" class="tm-accent-text">Max</text>
    
    <!-- Pro Tech Badge / Tag -->
    <rect x="238" y="-42" width="54" height="22" rx="6" fill="rgba(37, 99, 235, 0.1)" stroke="rgba(37, 99, 235, 0.3)" stroke-width="1.5"/>
    <text x="249" y="-26" class="tm-badge-text">PRO</text>
  </g>
</svg>
